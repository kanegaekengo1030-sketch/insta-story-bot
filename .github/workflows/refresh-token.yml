name: Instagramトークン自動更新

on:
  schedule:
    # 毎月1日 09:00 JST (= 00:00 UTC)
    - cron: "0 0 1 * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: トークンを延長してSecretを上書き
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "ERROR: GH_PAT secret is not set"; exit 1
          fi
          python3 refresh_token.py | gh secret set IG_ACCESS_TOKEN --repo "$REPO"
          echo "IG_ACCESS_TOKEN updated"
